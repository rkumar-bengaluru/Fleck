[project]
name = "fleck-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleck-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "markitdown[docx,pdf,pptx]>=0.1.9",
    "openpyxl>=3.1.5",
    "minio>=7.2.20",
    "python-multipart>=0.0.32",
    "cryptography>=46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleck_api"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "openpyxl>=3.1", "python-pptx>=1.0"]
