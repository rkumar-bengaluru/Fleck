[project]
name = "fleck-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fleck-core", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleck_api"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
