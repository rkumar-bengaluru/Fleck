[project]
name = "fleck-core"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "text2num>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleck_core"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
