name: fleck
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: fleck, POSTGRES_PASSWORD: fleck, POSTGRES_DB: fleck}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U fleck"], interval: 3s, timeout: 3s, retries: 20}
  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    command: ["server", "/data", "--console-address", ":9001"]
    environment: {MINIO_ROOT_USER: fleck, MINIO_ROOT_PASSWORD: fleck-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    environment:
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:50051:50051"]
    volumes: [weaviatedata:/var/lib/weaviate]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/v1/.well-known/ready"], interval: 3s, timeout: 3s, retries: 20}
  gsim:
    build: {context: .., dockerfile: gsim/Dockerfile}
    ports: ["127.0.0.1:8090:8090"]
  api:
    build: {context: .., dockerfile: api/Dockerfile}
    env_file: [{path: ../.env, required: false}]
    environment:
      FLECK_DATABASE_URL: postgresql://fleck:fleck@postgres:5432/fleck
      FLECK_MINIO_URL: http://minio:9000
      FLECK_WEAVIATE_URL: http://weaviate:8080
      FLECK_OLLAMA_URL: http://host.docker.internal:11434
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
      weaviate: {condition: service_healthy}
volumes: {pgdata: {}, miniodata: {}, weaviatedata: {}}
# worker and web are added in Tasks 3 and 9
