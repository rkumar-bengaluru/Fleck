<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu-bar menu and meeting notification</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6B63}a:hover{color:#084F49}
button{font:inherit}
button:focus-visible{outline:2px solid #0B6B63;outline-offset:2px}
</style>
</helmet>
<div style="width:380px;height:560px;box-sizing:border-box;padding:16px;background:#C9D2DA;font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#17222D;display:flex;flex-direction:column;gap:16px">

  <div role="alert" style="background:rgba(246,248,250,0.97);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,0.18);padding:12px 14px;display:flex;gap:12px;align-items:center">
    <div style="width:36px;height:36px;border-radius:9px;background:#0B6B63;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="4" fill="#FFFFFF"/></svg></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:700">Presales: Harbourline Legal</div>
      <div style="font-size:13px;color:#4A5562">Starts in 5 min. Brief is ready.</div>
    </div>
    <button style="height:32px;padding:0 14px;border-radius:7px;border:none;background:#0B6B63;color:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer">Record</button>
  </div>

  <div role="menu" aria-label="Fleck" style="background:rgba(246,248,250,0.98);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.22);padding:6px;font-size:14px;display:flex;flex-direction:column">
    <div style="padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:8px;font-weight:700"><span style="width:8px;height:8px;border-radius:50%;background:#C2332B"></span>Recording 23:41</div>
      <div style="color:#4A5562">Presales: Harbourline Legal</div>
      <button style="align-self:flex-start;height:30px;padding:0 14px;border-radius:7px;border:1px solid #C2332B;background:#FFFFFF;color:#A3241D;font-weight:700;cursor:pointer">Stop recording</button>
    </div>
    <div style="height:1px;background:#D5DBE1;margin:4px 6px"></div>
    <button role="menuitem" style="display:flex;justify-content:space-between;padding:7px 10px;border:none;background:transparent;border-radius:6px;color:#17222D;text-align:left;cursor:pointer">Hide answer panel<span style="color:#566270">⌥⌘F</span></button>
    <button role="menuitem" style="display:flex;padding:7px 10px;border:none;background:transparent;border-radius:6px;color:#17222D;text-align:left;cursor:pointer">Open meeting in browser</button>
    <div style="height:1px;background:#D5DBE1;margin:4px 6px"></div>
    <div style="padding:6px 10px 2px;font-size:13px;color:#566270">Today</div>
    <button role="menuitem" style="display:flex;gap:12px;padding:7px 10px;border:none;background:#E1EFED;border-radius:6px;color:#17222D;text-align:left;cursor:pointer"><span style="color:#566270;width:42px">11:00</span>Presales: Harbourline Legal</button>
    <button role="menuitem" style="display:flex;gap:12px;padding:7px 10px;border:none;background:transparent;border-radius:6px;color:#17222D;text-align:left;cursor:pointer"><span style="color:#566270;width:42px">14:30</span>Pricing review (internal)</button>
    <button role="menuitem" style="display:flex;gap:12px;padding:7px 10px;border:none;background:transparent;border-radius:6px;color:#17222D;text-align:left;cursor:pointer"><span style="color:#566270;width:42px">16:00</span>Discovery: Orion Freight</button>
    <div style="height:1px;background:#D5DBE1;margin:4px 6px"></div>
    <button role="menuitem" style="display:flex;padding:7px 10px;border:none;background:transparent;border-radius:6px;color:#17222D;text-align:left;cursor:pointer">Start recording now</button>
    <button role="menuitem" style="display:flex;padding:7px 10px;border:none;background:transparent;border-radius:6px;color:#17222D;text-align:left;cursor:pointer">Open Fleck</button>
    <div style="height:1px;background:#D5DBE1;margin:4px 6px"></div>
    <div style="padding:6px 10px;font-size:13px;color:#566270">Connected as rupak@northbeam.test</div>
    <button role="menuitem" style="display:flex;padding:7px 10px;border:none;background:transparent;border-radius:6px;color:#17222D;text-align:left;cursor:pointer">Quit Fleck</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":560}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
