# Presales call, Northbeam Digital (you, Rishi, left) with Harbourline Legal (client, Samantha, right).
# gap = seconds of silence before the turn (default 0.6; 2.5 after a question so the answer can appear).
# overlap: the client starts 0.4 s before the previous turn ends. q/expect/doc/used mark a scripted library question.
voices: {you: Rishi, client: Samantha}
turns:
  # small talk and agenda (no questions to answer)
  - {who: you, text: "Good morning Dana, good morning Marcus. Thanks for making the time today."}
  - {who: client, text: "Morning. Can you hear me okay?"}
  - {who: you, text: "Loud and clear. Can you hear me alright on your side?"}
  - {who: client, text: "Yes, perfectly. The line is much better than last week."}
  - {who: you, text: "Good. I know you were travelling on Monday, how was the trip back from Manchester?"}
  - {who: client, text: "Long, honestly. The train was delayed by an hour and then it rained the whole way home."}
  - {who: you, text: "That sounds exhausting. I hope the weekend made up for it."}
  - {who: client, text: "It did. We went to my sister's place and I did absolutely nothing, which was the plan."}
  - {who: you, text: "That is the best kind of weekend. We had a bit of monsoon here in Bengaluru, so the traffic was a nightmare as usual."}
  - {who: client, text: "I can imagine. Marcus is just dialling in from the other office, he says hello."}
  - {who: you, text: "Hello Marcus. Lovely to have you both. Let me share my screen so we have the agenda in front of us."}
  - {who: client, text: "Can you see my screen? No, sorry, that is the wrong way round. Can you see yours, I mean."}
  - {who: you, text: "I can see mine, and I am sharing it now. Can you see my screen?"}
  - {who: client, text: "Yes, it is up. The text is a good size."}
  - {who: you, text: "Great. The agenda has four items. First, what you are trying to fix. Second, how we have done this before. Third, how a project would work. Fourth, next steps."}
  - {who: client, text: "That works for us. Shall we take ten minutes at the end for next steps?"}
  - {who: you, text: "Yes, absolutely, I will keep ten minutes at the end for that."}
  # context
  - {who: client, text: "So, as Dana mentioned in the invite, our associates spend far too long on first pass review of contracts. We receive about four hundred N D A s a quarter, and every one is read by hand."}
  - {who: you, text: "Four hundred a quarter is a serious backlog. And what matters most to you in fixing it?", gap: 0.8}
  - {who: client, text: "Speed matters, of course, but Marcus is firm that nothing may leave iManage. No copies in outside storage, ever.", overlap: true}
  - {who: you, text: "Understood, everything stays inside iManage. Let me note that down. Let me also tell you what we propose to do, then I will take your questions as we go."}
  - {who: you, text: "We would build a review assistant inside your document system. It reads an incoming agreement, proposes tracked changes against your own playbook, and every suggestion shows the playbook clause behind it. Your people accept or reject each change."}
  - {who: client, text: "That is roughly what we had in mind. Before we go further, let me ask about the team."}
  # rates
  - {who: client, text: "What does a senior engineer cost per month, offshore?", q: q_rate, expect: library, doc: "Rate card FY2026", used: true}
  - {who: you, text: "A senior engineer working offshore from Bengaluru is five thousand two hundred dollars a month. The onsite rate is higher, but most of the team would be offshore."}
  - {who: client, text: "Okay. That is about what we expected."}
  # start
  - {who: client, text: "How quickly could you have a team working on this?", q: q_start, expect: library, doc: "Delivery FAQ", used: true}
  - {who: you, text: "A pod of up to six people can start within two weeks of signing. If you needed twenty people, that takes four weeks. If we agree in time, we could begin on the fifteenth of November."}
  - {who: client, text: "The fifteenth of November would suit us. We close our budget cycle just before that."}
  # ip
  - {who: client, text: "Who owns the code you write for us?", q: q_ip, expect: library, doc: "Delivery FAQ", used: false}
  - {who: you, text: "Before that, one thing on iManage, because I think it decides the architecture. We would run the whole assistant inside your iManage environment, so no document is copied anywhere outside it. Is that how Marcus pictures it?"}
  - {who: client, text: "Yes, that is exactly the picture. Nothing outside iManage."}
  - {who: you, text: "Good, then we are aligned on that."}
  # sla
  - {who: client, text: "If something breaks at night, how fast do you respond?", q: q_sla, expect: library, doc: "Delivery FAQ", used: false}
  - {who: you, text: "We run a support rota that covers your hours, so a serious fault at night reaches a person quickly and not a queue. I will send the full support terms in writing after the call."}
  - {who: client, text: "That is fine, as long as it is written down.", overlap: true}
  - {who: you, text: "It will be. Let me move on to the work we have done in your field."}
  # case
  - {who: client, text: "Have you automated redline review for a law firm before?", q: q_case, expect: library, doc: "Case study: Calloway & Marsh", used: true}
  - {who: you, text: "Yes. For a mid size law firm we built a redline assistant that proposes tracked changes against the firm's playbook. First pass review went from about three hours to forty minutes per agreement, and most of the proposed changes were accepted without edits."}
  - {who: client, text: "That is encouraging. Our partners are cautious about anything that sounds like a black box."}
  - {who: you, text: "We also learned a lesson there. We split the playbook into one entry per clause position before the pilot started, which saved weeks of work on matching."}
  - {who: client, text: "Our playbook is a single long document, so that is useful to know. Marcus can tell you how it is organised."}
  # general
  - {who: client, text: "How do you stop the model inventing clauses in a contract?", q: q_general, expect: general, doc: null, used: true}
  - {who: you, text: "You keep the model tied to the text in front of it, make it point to the exact clause it used for every suggestion, and have a person accept or reject every change. If it cannot point to a clause, it should say so instead of guessing."}
  - {who: client, text: "Good. That is the answer the partners want to hear."}
  # logistics
  - {who: client, text: "Is it all right if I send you our playbook after this call?"}
  - {who: you, text: "Please do. I will keep it inside the secure folder we agreed."}
  # liability
  - {who: client, text: "Would you cap liability at twelve months of fees?", q: q_liability, expect: reference, doc: "Photronics outsourcing agreement", used: false}
  - {who: you, text: "That is one for the contract discussion. We are open to a cap, and our lawyers will want to see your draft before we agree anything."}
  - {who: client, text: "Fair enough. We will send our draft with the playbook."}
  # price
  - {who: client, text: "Ballpark, what would the whole project cost us?", q: q_price, expect: not_in_material, doc: null, used: false}
  - {who: you, text: "I would rather not guess. We would scope that properly in a paid discovery phase, and then give you a fixed price you can hold us to."}
  - {who: client, text: "That is reasonable. Dana will want to see the discovery plan."}
  # wrap
  - {who: you, text: "Good. Let me use the last minutes for next steps. I will send the support terms and a discovery plan, you send the playbook and your draft contract, and we meet again next week."}
  - {who: client, text: "Does Thursday work for the follow up?"}
  - {who: you, text: "Thursday works. I will send the invite today."}
  - {who: client, text: "Thank you both. This was a useful call."}
  - {who: you, text: "Thank you, Dana. Thank you, Marcus. Speak on Thursday."}
