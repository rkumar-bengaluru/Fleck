[project]
name = "fleck-gsim"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleck_gsim"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
